<svg xmlns="http://www.w3.org/2000/svg" width="760" height="820" viewBox="0 0 760 820" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <pattern id="grid" width="35" height="35" patternUnits="userSpaceOnUse">
      <path d="M 35 0 L 0 0 0 35" fill="none" stroke="#e4e4e4" stroke-width="2"/>
    </pattern>
    <marker id="aberta" viewBox="0 0 20 20" refX="19" refY="10" markerWidth="20" markerHeight="20" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M 1 2 L 19 10 L 1 18" fill="none" stroke="#000" stroke-width="2"/>
    </marker>
  </defs>

  <rect width="760" height="820" fill="#fff"/>
  <rect width="760" height="820" fill="url(#grid)"/>

  <!-- sombras -->
  <g fill="#e9e9e9">
    <rect x="126" y="106" width="190" height="110"/>
    <rect x="126" y="336" width="190" height="110"/>
    <rect x="486" y="356" width="190" height="110"/>
    <rect x="126" y="626" width="190" height="110"/>
    <rect x="486" y="626" width="190" height="110"/>
  </g>

  <g fill="#fff" stroke="#000" stroke-width="2">
    <!-- Iterable -->
    <rect x="120" y="100" width="190" height="110"/>
    <line x1="120" y1="160" x2="310" y2="160"/><line x1="120" y1="185" x2="310" y2="185"/>
    <!-- Pousada -->
    <rect x="120" y="330" width="190" height="110"/>
    <line x1="120" y1="390" x2="310" y2="390"/><line x1="120" y1="415" x2="310" y2="415"/>
    <!-- Iterator -->
    <rect x="480" y="350" width="190" height="110"/>
    <line x1="480" y1="410" x2="670" y2="410"/><line x1="480" y1="435" x2="670" y2="435"/>
    <!-- Quarto -->
    <rect x="120" y="620" width="190" height="110"/>
    <line x1="120" y1="680" x2="310" y2="680"/><line x1="120" y1="705" x2="310" y2="705"/>
    <!-- Relatorio -->
    <rect x="480" y="620" width="190" height="110"/>
    <line x1="480" y1="680" x2="670" y2="680"/><line x1="480" y1="705" x2="670" y2="705"/>
  </g>

  <g fill="#000" text-anchor="middle" font-size="28" font-weight="bold">
    <text x="215" y="140">Iterable</text>
    <text x="215" y="370">Pousada</text>
    <text x="575" y="390">Iterator</text>
    <text x="215" y="660">Quarto</text>
    <text x="575" y="660">Relatorio</text>
  </g>

  <g fill="none" stroke="#000" stroke-width="2">
    <!-- Pousada herda/implementa Iterable -->
    <line x1="215" y1="330" x2="215" y2="272"/>
    <path d="M 215 212 L 191 272 L 239 272 Z" fill="#fff"/>

    <!-- Pousada -> Quarto (associação 0..*) -->
    <line x1="215" y1="440" x2="215" y2="618" marker-end="url(#aberta)"/>

    <!-- dependências tracejadas -->
    <g stroke-dasharray="9,7">
      <line x1="312" y1="375" x2="478" y2="385" marker-end="url(#aberta)"/>
      <polyline points="120,375 70,375 70,700 118,700" marker-end="url(#aberta)"/>
      <line x1="510" y1="620" x2="290" y2="442" marker-end="url(#aberta)"/>
      <line x1="575" y1="620" x2="575" y2="462" marker-end="url(#aberta)"/>
      <line x1="480" y1="692" x2="312" y2="692" marker-end="url(#aberta)"/>
    </g>
  </g>

  <text x="148" y="598" font-size="26" fill="#000">0..*</text>
</svg>
